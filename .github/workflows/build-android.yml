name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci

      - name: Download & Verify Official Gradle 8.14.3 Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          EXPECTED_SHA="7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172"
          ACTUAL_SHA=$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Gradle wrapper JAR SHA-256 verification failed!"
            exit 1
          fi
          echo "✓ Official Gradle 8.14.3 wrapper JAR downloaded and verified successfully."

      - name: Generate Android & PWA Assets from Vector SVG
        run: npm run generate:assets

      - name: Run Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Toolchain Versions
        run: |
          echo "=== NODE VERSION ==="
          node --version
          echo "=== JAVA VERSION ==="
          java -version
          echo "=== JAVAC VERSION ==="
          javac -version
          echo "=== GRADLE VERSION ==="
          cd android
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayTrace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
