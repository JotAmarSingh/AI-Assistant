name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      DAYTRACE_KEYSTORE_BASE64: ${{ secrets.DAYTRACE_KEYSTORE_BASE64 }}
      DAYTRACE_KEYSTORE_PASSWORD: ${{ secrets.DAYTRACE_KEYSTORE_PASSWORD }}
      DAYTRACE_KEY_ALIAS: ${{ secrets.DAYTRACE_KEY_ALIAS }}
      DAYTRACE_KEY_PASSWORD: ${{ secrets.DAYTRACE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Official Gradle action caches downloaded dependencies between runs.
      # Keep this separate from setup-java caching as recommended by Gradle.
      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        # The exported lockfile omits platform-specific optional packages, so npm ci rejects it.
        run: npm install --no-audit --no-fund

      - name: Download & Verify Official Gradle 8.14.3 Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          EXPECTED_SHA="7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172"
          ACTUAL_SHA=$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Gradle wrapper JAR SHA-256 verification failed!"
            exit 1
          fi
          echo "✓ Official Gradle 8.14.3 wrapper JAR downloaded and verified successfully."

      - name: Generate Android & PWA Assets from Vector SVG
        run: npm run generate:assets

      - name: Run Linter
        run: npm run lint

      - name: Run DayTrace Regression Tests
        run: |
          npm run test:native-accountability
          npm run test:day-history
          npm run test:state-migrations
          npm run test:multi-triggers
          npm run test:meetings
          npm run test:task-parsing
          npm run test:ai-context
          npm run test:ai-routing
          npm run test:accountability
          npm run test:release-ui

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          rm -f dist/server.cjs dist/server.cjs.map
          npx cap sync android

      - name: Prepare Stable DayTrace Signing Identity
        if: ${{ env.DAYTRACE_KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/daytrace-stable.jks"
          printf '%s' "$DAYTRACE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "DAYTRACE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Toolchain Versions
        run: |
          echo "=== NODE VERSION ==="
          node --version
          echo "=== JAVA VERSION ==="
          java -version
          echo "=== JAVAC VERSION ==="
          javac -version
          echo "=== GRADLE VERSION ==="
          cd android
          chmod +x ./gradlew
          ./gradlew --version

      - name: Report APK Signing Identity
        run: |
          cd android
          bash ../scripts/run-gradle-with-retry.sh :app:signingReport --stacktrace

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          if [ -n "$DAYTRACE_KEYSTORE_PATH" ]; then
            bash ../scripts/run-gradle-with-retry.sh clean assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/DayTrace.apk
          else
            echo "::warning::Stable signing secrets are missing. This debug APK may not update an APK signed by another runner."
            bash ../scripts/run-gradle-with-retry.sh clean assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/DayTrace.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayTrace-apk
          path: android/app/build/outputs/apk/DayTrace.apk
          if-no-files-found: error
          retention-days: 30
